<!DOCTYPE html>
<html lang="en" class="md-theme-default">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <style type="text/css"></style>
        <link rel="icon" type="imge/jpeg" href="./assets/personal-logo.jpg"> >
        <link rel="stylesheet" href="./style.css">
        <script src="./script.js" defer></script>
    </head>
    <body>
        <header>
            <img src="./assets/personal-logo.jpg" alt="personal logo" class="logo">
            <h1>RP Anime Finder</h1>
            <nav>
                <a href="#">Browse</a>
                <a href="#">Search</a>
                <a href="#">About</a>
            </nav>
        </header>
        <main>
            <div class="search-controls">
                <label for="search">Search Anime</label>
                <input type="text" id="search" placeholder="Search for an anime">
                <button type= "button" id= "search-button">Search</button>
                <div class="filter-controls">
                    <label for="year-filter">Aired Year</label>
                    <select id="year-filter">
                        <option value="all">All Years</option>
                    </select>
                </div>
                <div class="filter-controls">
                    <label for="sort-filter">Sort By</label>
                    <select id="sort-filter">
                        <option value="default">Default</option>
                        <option value="az">A to Z</option>
                        <option value="za">Z to A</option>
                        <option value="newest">Newest to Oldest</option>
                        <option value="oldest">Oldest to Newest</option>
                    </select>
                </div>
            </div>
             
            <div id="anime-results"></div>
        </main>
        <footer>

        </footer>
       
    </body>
</html>
